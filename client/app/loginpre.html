<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 与 index.html 保持一致：留空 = 同源；跨域部署时填后端域名 -->
  <meta name="rs-api-base" content="https://web-production-5d0b6.up.railway.app">
  <title>REDSIGNAL · 评委入口</title>
  <style>
    :root {
      --bg:#F7F1E8; --card:#FFFBF5; --text:#2C2620; --sub:#8A8178;
      --red:#D95D5D; --line:rgba(44,38,32,0.14);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      background:#E8E0D4; color:var(--text);
      display:flex; justify-content:center; align-items:center; overflow:hidden;
    }
    #shell {
      width:100%; max-width:430px; height:100dvh; max-height:932px;
      background:var(--bg); position:relative; overflow-y:auto;
      display:flex; flex-direction:column; justify-content:center;
      padding:32px 30px calc(32px + env(safe-area-inset-bottom));
      box-shadow:0 0 0 1px rgba(44,38,32,0.06), 0 20px 60px rgba(44,38,32,0.18);
    }
    @supports not (height: 100dvh) { #shell { height:100vh; } }

    .brand { font-size:28px; font-weight:800; letter-spacing:3px; margin-bottom:8px; }
    .brand span { color:var(--red); }
    .tagline { font-size:14px; color:var(--sub); line-height:1.7; margin-bottom:30px; }

    .who { display:flex; gap:10px; margin-bottom:22px; }
    .who button {
      flex:1; padding:16px 0; border:1.2px solid var(--line); border-radius:16px;
      background:var(--card); color:var(--text); font:inherit; font-size:14px;
      font-weight:600; cursor:pointer; line-height:1.5;
    }
    .who button small { display:block; font-weight:400; font-size:11px; color:var(--sub); margin-top:3px; }
    .who button.on { border-color:var(--red); box-shadow:0 0 0 2px rgba(217,93,93,.14); }

    .go {
      width:100%; padding:15px 0; font-size:15px; font-weight:700; color:#FFFBF5;
      background:var(--text); border:0; border-radius:16px; cursor:pointer;
    }
    .note {
      margin-top:22px; padding:12px 14px; border-radius:12px;
      background:rgba(44,38,32,.06); font-size:12px; color:var(--sub); line-height:1.7;
    }
    .note b { color:var(--text); font-weight:600; }
    .status { margin-top:14px; font-size:12px; color:var(--sub); min-height:18px; }
  </style>
</head>
<body>
  <div id="shell">
    <div class="brand"><span>RED</span>SIGNAL</div>
    <div class="tagline">评委入口 · 已预设现场演示状态<br>无需注册，选一个身份直接进入</div>

    <div class="who">
      <button type="button" class="on" data-user="u_demo_a">信号狐<small>u_demo_a</small></button>
      <button type="button" data-user="u_demo_b">夜航鲸<small>u_demo_b</small></button>
    </div>

    <button class="go" id="go" type="button">进入</button>
    <div class="status" id="status"></div>

    <div class="note">
      <b>连戒指请用桌面 Chrome。</b>首次需在
      <b>chrome://flags/#enable-web-bluetooth-new-permissions-backend</b>
      打开开关并重启浏览器，授权一次戒指之后，以后进来会自动连、不再弹窗。
      iPhone 上没有 Web Bluetooth，会自动跳过感应直接进流程。
    </div>
  </div>

  <script>
    const buttons = [...document.querySelectorAll('.who button')];
    let picked = 'u_demo_a';
    buttons.forEach(b => b.onclick = () => {
      buttons.forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      picked = b.dataset.user;
    });

    const st = document.getElementById('status');

    document.getElementById('go').onclick = async () => {
      // 标记评委模式：backend.js 据此走"必成流程"，外部用户走真实匹配
      localStorage.setItem('redsignal.mode', 'judge');
      // 评委不登录，用预置身份；清掉可能残留的真实会话，避免串号
      localStorage.removeItem('redsignal.session');

      // 顺手把戒指授权一次：这里是用户手势上下文，可以合法弹选择器。
      // 授权过之后 getDevices() 就能记住它，之后自动连不再打扰。
      if (navigator.bluetooth && navigator.bluetooth.getDevices) {
        try {
          const known = await navigator.bluetooth.getDevices();
          if (!known.length) {
            st.textContent = '正在授权戒指（选一次即可，之后自动记住）…';
            await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
          }
        } catch { /* 取消或不支持都不挡路 */ }
      }
      location.replace('./?user=' + encodeURIComponent(picked));
    };
  </script>
</body>
</html>
